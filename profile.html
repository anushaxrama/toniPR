<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · ToniPR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Lora:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/platform-logo.css?v=2" />
  <link rel="stylesheet" href="css/dashboard-layout.css" />
  <link rel="stylesheet" href="css/page-bg.css" />
  <style>
    :root { --bg:#fff; --bg-card:#fafafa; --bg-warm:#f5f5f5; --bg-elevated:#f5f5f5; --border:rgba(0,0,0,0.08); --text-primary:#0a0a0a; --text-secondary:#525252; --text-muted:#737373; --accent:#D7263D;--toni-cyan:#D7263D; --accent-soft:#E85A6F; --radius-sm:12px; --radius-md:16px; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Nunito',sans-serif; background-color:#fff; color:var(--text-primary); min-height:100vh; -webkit-font-smoothing:antialiased; position:relative; }
    .dashboard-layout { display:flex; min-height:100vh; }
    .sidebar { width:260px; min-width:260px; background:var(--bg); border-right:1px solid var(--border); padding:24px 20px; display:flex; flex-direction:column; }
    .sidebar-logo { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:1.25rem; color:var(--text-primary); text-decoration:none; display:flex; align-items:center; gap:10px; margin-bottom:32px; }
    .sidebar-logo-brand { display:flex; flex-direction:column; gap:0; }
    .sidebar-logo-by { font-family:'Nunito',sans-serif; font-weight:500; font-size:0.65rem; color:var(--text-muted); letter-spacing:0.04em; text-transform:uppercase; margin-top:2px; }
    .sidebar-logo img { width: 32px; height: 32px; border-radius: 50%; object-fit: contain; flex-shrink: 0; }
    .credits-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; margin-bottom:32px; }
    .credits-card-label { font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }
    .credits-card-suffix { font-size:0.8rem; font-weight:500; color:var(--text-muted); margin-bottom:12px; }
    .credits-card-value { font-family:'Bricolage Grotesque',sans-serif; font-size:1.75rem; font-weight:700; color:var(--accent); margin-bottom:4px; }
    .sidebar-nav { flex:1; }
    .sidebar-nav a { display:flex; align-items:center; gap:12px; padding:10px 12px; color:var(--text-secondary); text-decoration:none; font-size:0.9rem; font-weight:500; border-radius:var(--radius-sm); margin-bottom:4px; transition:all 0.2s; }
    .sidebar-nav a:hover { background:var(--bg-elevated); color:var(--text-primary); }
    .sidebar-nav a.active { background:rgba(215,38,61,0.08); color:var(--accent); }
    .sidebar-nav-icon { width:20px; height:20px; opacity:0.7; }
    .sidebar-nav a.active .sidebar-nav-icon { opacity:1; }
    .sidebar-divider { height:1px; background:var(--border); margin:20px 0; }
    .sidebar-plan-name { font-family:'Bricolage Grotesque',sans-serif; font-size:1.05rem; font-weight:600; color:var(--text-primary); margin-bottom:6px; }
    .sidebar-plan-link { font-size:0.85rem; font-weight:600; color:var(--accent); text-decoration:none; display:inline-block; margin-bottom:2px; }
    .sidebar-plan-link:hover { text-decoration:underline; }
    .credits-card-divider { height:1px; background:var(--border); margin:14px 0; }
    .sidebar-user-link { margin-top:auto; text-decoration:none; color:inherit; display:block; border-top:1px solid var(--border); padding-top:16px; border-radius:var(--radius-sm); transition:background 0.2s; }
    .sidebar-user-link:hover { background:var(--bg-warm); }
    .sidebar-user-link:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .sidebar-user { padding-top:0; border-top:none; }
    .sidebar-user-info { display:flex; align-items:center; gap:10px; padding:12px 0; }
    .sidebar-user-avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.9rem; }
    .sidebar-user-name { font-size:0.9rem; font-weight:500; }
    .sidebar-user-company { font-size:0.8rem; color:var(--text-muted); }
    .main { flex:1; padding:32px 40px 48px; overflow-y:auto; }
    .main h1 { font-family:'Bricolage Grotesque',sans-serif; font-size:1.5rem; font-weight:600; margin-bottom:32px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 24px; border-radius:var(--radius-sm); font-weight:600; font-size:0.9rem; cursor:pointer; text-decoration:none; border:none; font-family:inherit; transition:all 0.2s; }
    .btn-primary { background:var(--accent); color:white; }
    .btn-primary:hover { background:var(--accent-soft); transform:translateY(-1px); }
    .btn-secondary { background:var(--bg-elevated); color:var(--text-primary); border:1px solid var(--border); }
    .btn-secondary:hover { background:#ebebeb; }
    .profile-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:32px; max-width:480px; }
    .profile-avatar { width:80px; height:80px; border-radius:50%; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:1.5rem; margin-bottom:24px; }
    .form-group { margin-bottom:20px; }
    .form-group label { display:block; font-size:0.9rem; font-weight:500; color:var(--text-secondary); margin-bottom:8px; }
    .form-group input { width:100%; padding:12px 16px; font-size:1rem; font-family:inherit; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); }
    .form-group input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(215,38,61,0.1); }
    .form-actions { display:flex; gap:12px; margin-top:24px; }
    .toast { position:fixed; bottom:24px; right:24px; background:var(--text-primary); color:white; padding:12px 20px; border-radius:var(--radius-sm); font-size:0.9rem; opacity:0; transform:translateY(10px); transition:all 0.3s; z-index:1000; }
    .toast.show { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <div class="page-bg__wash"></div>
    <div class="page-bg__art">
      <div class="page-bg__corner page-bg__corner--tr"></div>
      <div class="page-bg__corner page-bg__corner--tl"></div>
      <div class="page-bg__corner page-bg__corner--br"></div>
      <div class="page-bg__corner page-bg__corner--bl"></div>
      <div class="page-bg__rift"></div>
    </div>
  </div>
  <div class="app-frame">
  <header class="dashboard-topbar">
    <button type="button" class="nav-drawer-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
    <a href="dashboard.html" class="topbar-brand-mini logo--platform-mark" aria-label="ToniPR home"><img src="assets/toni/toni-header-logo.png?v=2" alt="" class="logo-platform-img" width="160" height="40" /></a>
    <nav class="topbar-util">
      <a href="support.html">Support</a>
      <a href="profile.html" aria-current="page">Profile</a>
      <a href="settings.html">Settings</a>
      <a href="auth.html">Sign out</a>
    </nav>
  </header>
  <div class="sidebar-overlay" aria-hidden="true"></div>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="sidebar-logo logo--platform-mark" aria-label="ToniPR home"><img src="assets/toni/toni-header-logo.png?v=2" alt="" class="logo-platform-img" width="180" height="44" /></a>
      <div class="credits-card">
        <div class="credits-card-label">Your plan</div>
        <div class="sidebar-plan-name" id="sidebarPlanName">Founder plan</div>
        <a href="pricing.html" class="sidebar-plan-link">View pricing &amp; plans</a>
        <div class="credits-card-divider"></div>
        <div class="credits-card-label">Sessions</div>
        <div class="credits-card-value" id="creditsValue">11</div>
        <div class="credits-card-suffix" id="creditsSuffix">remaining this year, use anytime</div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="sidebar-nav-icon">⌂</span> Dashboard</a>
        <a href="interviews.html"><span class="sidebar-nav-icon">🎙</span> My Interviews</a>
        <a href="linkedin-posts.html"><span class="sidebar-nav-icon">in</span> LinkedIn Posts</a>
        <a href="x-threads.html"><span class="sidebar-nav-icon">𝕏</span> X Threads</a>
        <a href="founder-kit.html"><span class="sidebar-nav-icon">📁</span> Founder Kit</a>
        <a href="blog-articles.html"><span class="sidebar-nav-icon">📄</span> Blog Articles</a>
      </nav>
      <div class="sidebar-user">
        <div class="sidebar-user-info">
          <div class="sidebar-user-avatar" id="sidebarAvatar">AR</div>
          <div>
            <div class="sidebar-user-name" id="sidebarName">Anusha Ramachandran</div>
            <div class="sidebar-user-company" id="sidebarCompany">flowops</div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main">
      <h1>Profile</h1>
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar">AR</div>
        <form id="profileForm">
          <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@company.com" />
          </div>
          <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" placeholder="Your company" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </main>
  </div>
  </div>
  <div class="toast" id="toast">Profile saved</div>
  <script src="js/dashboard-shell.js"></script>
  <script src="js/app-sidebar.js"></script>
  <script>
    (function() {
      var KEY = 'tonipr_profile';
      var defaults = { name: 'Anusha Ramachandran', email: '', company: 'flowops' };
      function load() {
        var p = JSON.parse(localStorage.getItem(KEY) || '{}');
        p = { name: p.name || defaults.name, email: p.email || defaults.email, company: p.company || defaults.company };
        document.getElementById('name').value = p.name;
        document.getElementById('email').value = p.email;
        document.getElementById('company').value = p.company;
        updateAvatars(p.name);
      }
      function updateAvatars(name) {
        var initials = (name || '').split(' ').map(function(n) { return n[0]; }).join('').substring(0, 2).toUpperCase() || 'U';
        var a = document.getElementById('profileAvatar');
        var s = document.getElementById('sidebarAvatar');
        if (a) a.textContent = initials;
        if (s) s.textContent = initials;
      }
      function save(p) {
        localStorage.setItem(KEY, JSON.stringify(p));
        document.getElementById('sidebarName').textContent = p.name;
        document.getElementById('sidebarCompany').textContent = p.company || '';
        updateAvatars(p.name);
      }
      load();
      document.getElementById('profileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var p = { name: document.getElementById('name').value.trim(), email: document.getElementById('email').value.trim(), company: document.getElementById('company').value.trim() };
        save(p);
        var t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2500);
      });
    })();
  </script>
</body>
</html>
