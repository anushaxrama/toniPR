<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support · ToniPR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Lora:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/page-bg.css" />
  <style>
    :root { --accent: #D7263D; --toni-cyan: #D7263D; --text: #1C1816; --muted: #6b6560; --border: rgba(0,0,0,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background-color: #ffffff; color: var(--text); line-height: 1.65; min-height: 100vh; padding: 48px 24px; position: relative; }
    .wrap { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }
    h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.75rem; margin-bottom: 12px; }
    p { color: var(--muted); margin-bottom: 16px; }
    a { color: var(--accent); font-weight: 600; }
    .back { display: inline-block; margin-bottom: 24px; text-decoration: none; color: var(--muted); }
    .back:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <div class="page-bg__wash"></div>
    <div class="page-bg__art">
      <div class="page-bg__corner page-bg__corner--tr"></div>
      <div class="page-bg__corner page-bg__corner--tl"></div>
      <div class="page-bg__corner page-bg__corner--br"></div>
      <div class="page-bg__corner page-bg__corner--bl"></div>
      <div class="page-bg__rift"></div>
    </div>
  </div>
  <div class="wrap">
    <a href="dashboard.html" class="back" id="backBtn">← Back</a>
    <h1>Support</h1>
    <p>Need help with your PR kit, interviews, or billing? We’re here for you.</p>
    <p>Replace this page with your help desk or inbox when ready. For now, contact your Tunepact team through your usual channel.</p>
    <p><a href="index.html">ToniPR home</a> · <a href="pricing.html">Pricing</a></p>
  </div>
<script>
  document.getElementById('backBtn')?.addEventListener('click', function (e) {
    if (window.history.length > 1) { e.preventDefault(); window.history.back(); }
  });
</script>
</body>
</html>
